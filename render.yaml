services:
  - type: web
    name: scholaxia-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholaxia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: scholaxia-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

      # Sia AI — Gemini (primary) + Groq (fallback)
      - key: AI_BACKEND
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_FLASH_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_MAX_TOKENS
        value: "4096"
      - key: AI_TEMPERATURE
        value: "0.4"

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Brevo (OTP Email)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@scholaxia.com
      - key: BREVO_SENDER_NAME
        value: Scholaxia
      - key: OTP_EXPIRE_MINUTES
        value: "10"

      # Stripe (Payments — add later)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Firebase (Push Notifications) — set FIREBASE_CREDENTIALS_JSON in Render dashboard
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: firebase-credentials.json

      # ElevenLabs (Sia Voice)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2

      # Agora (Live Classes)
      - key: AGORA_APP_ID
        value: 2735ab34da634131bd67bdaa9a200d8b
      - key: AGORA_APP_CERTIFICATE
        sync: false

      # Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      - key: ALLOWED_ORIGINS
        value: '["*"]'

databases:
  - name: scholaxia-db
    databaseName: scholaxia
    user: scholaxia
    plan: free

  - name: scholaxia-redis
    type: redis
    plan: free

  # ── Static site — Sia Web Frontend ──────────────────────────────────────────
  # Deployed separately as a Render Static Site
  # Service name: scholaxia-web
  # Root directory: scholaxia/sia-web
  # Publish directory: . (the sia-web folder itself)
  # No build command needed — pure HTML/CSS/JS

- type: web
  name: scholaxia-admin-dashboard
  runtime: static
  buildCommand: echo "No build needed"
  startCommand: echo "No start command needed"
  envVars:
    - key: ALLOWED_ORIGINS
      value: '["*"]'
