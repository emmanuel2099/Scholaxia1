<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>School Portal — Scholaxia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#0d1b3e; --navy2:#122550; --navy3:#0a1734; --blue:#1a6ef5; --blue2:#0f56d6;
  --sky:#eaf2ff; --ink:#152242; --mut:#5d6b8a; --line:#e3e9f4; --bg:#f4f7fd;
  --ok:#16a34a; --okbg:#e7f8ee; --warn:#d97706; --warnbg:#fdf3e3; --bad:#dc2626; --badbg:#fdeaea;
  --card:#ffffff; --rad:16px; --sh:0 2px 14px rgba(21,34,66,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14.5px}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#eef4ff 0%,#dfe9fb 55%,#cddcf7 100%);padding:24px}
.login-card{background:#fff;border-radius:22px;box-shadow:0 24px 70px rgba(13,27,62,.18);max-width:420px;width:100%;padding:38px 34px}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-brand img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--sky)}
.login-brand .fallback-logo{width:52px;height:52px;border-radius:12px;background:var(--navy);color:#f7c948;display:flex;align-items:center;justify-content:center;font-size:26px}
.login-brand h1{font-size:20px;font-weight:800;color:var(--navy);line-height:1.15}
.login-brand small{color:var(--mut);font-size:12px}
.login-card h2{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:6px}
.login-card .sub{color:var(--mut);margin-bottom:24px;line-height:1.45}
.f-label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px;color:var(--navy)}
.f-in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;outline:none;background:#fbfcff;transition:border .15s}
.f-in:focus{border-color:var(--blue);background:#fff}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 18px;font-size:13.5px;color:var(--mut)}
.btn-login{width:100%;padding:13px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;transition:background .15s}
.btn-login:hover{background:var(--blue2)}
.btn-login[disabled]{opacity:.65;cursor:wait}
.login-err{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:13.5px}
.login-foot{margin-top:20px;text-align:center;color:#9aa7c2;font-size:12.5px}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy3) 100%);color:#cfd9ee;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .blogo{width:44px;height:44px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.brand .blogo img{width:100%;height:100%;object-fit:cover}
.brand .blogo span{font-size:22px}
.brand h3{color:#fff;font-size:15.5px;font-weight:700;line-height:1.2}
.brand small{color:#8fa3c8;font-size:11px}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#c2cee6;padding:11px 13px;border-radius:10px;font-size:14.5px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--blue);color:#fff;font-weight:600}
.nav .ico{width:20px;text-align:center;flex:none}
.side-foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#8fa3c8;line-height:1.6}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.topbar .search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 14px;color:var(--mut)}
.topbar .search input{border:none;background:none;outline:none;flex:1;color:var(--ink)}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.who .nm{font-weight:700;font-size:14px;line-height:1.1}
.who .rl{color:var(--mut);font-size:12px}
.content{padding:26px;max-width:1200px;width:100%}
.page{display:none}
.page.on{display:block}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-head h1{font-size:26px;font-weight:800;color:var(--navy)}
.page-head p{color:var(--mut);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:none;border-radius:11px;background:var(--blue);color:#fff;font-weight:600;font-size:14.5px}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:18px}
.card .cl{display:flex;gap:12px;align-items:center}
.card .cico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.card .clab{color:var(--mut);font-size:13px}
.card .cval{font-size:26px;font-weight:800;color:var(--navy)}
.panel{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;margin-bottom:20px}
.panel h3{font-size:16.5px;margin-bottom:14px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{ text-align:left;color:var(--mut);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1.5px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.blue{background:var(--sky);color:var(--blue)}
.pill.gray{background:#eef1f7;color:var(--mut)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-grid .full{grid-column:1/-1}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.muted{color:var(--mut)}
.stat-mini{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--sky);color:var(--blue);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:none;padding:11px 16px;font-size:14px;font-weight:600;color:var(--mut);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;cursor:pointer;background:#fbfcff}
.radio-row input{accent-color:var(--blue)}
#toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:99;box-shadow:0 10px 30px rgba(13,27,62,.3)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;width:250px;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.content{padding:16px}}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="blogo" id="lgLogoWrap"><span>🎓</span></div>
      <div><h1 id="lgSchool">School Portal</h1><small>Scholaxia School Platform</small></div>
    </div>
    <h2>Welcome back!</h2>
    <p class="sub">Log in to your school account and manage students, exams, results and more.</p>
    <form id="loginForm">
      <label class="f-label" for="lgId">Email or phone number</label>
      <input class="f-in" id="lgId" autocomplete="username" placeholder="admin@yourschool.com" required />
      <label class="f-label" for="lgPw">Password</label>
      <input class="f-in" id="lgPw" type="password" autocomplete="current-password" placeholder="Enter your password" required />
      <div class="login-row"><label><input type="checkbox" checked style="accent-color:var(--blue)" /> Remember me</label><a href="#" onclick="return false" style="color:var(--blue);text-decoration:none">Forgot password?</a></div>
      <button class="btn-login" id="lgBtn" type="submit">→&nbsp; Log In</button>
      <div class="login-err" id="lgErr"></div>
    </form>
    <p class="login-foot">Powered by Scholaxia · <span id="lgLink"></span></p>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="blogo" id="sbLogoWrap"><span>🎓</span></div>
        <div><h3 id="sbSchool">School</h3><small id="sbTag">Scholaxia School Platform</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">Better learning today,<br/>brighter futures tomorrow.<br/><span id="sbUser" style="color:#c2cee6"></span></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="search">🔍 <input id="gSearch" placeholder="Search anything…" /></div>
        <div class="who"><div class="avatar" id="uAvatar">A</div><div><div class="nm" id="uName">—</div><div class="rl">School Admin</div></div>
          <button class="btn sm ghost" onclick="logout()" style="margin-left:8px">Log out</button></div>
      </div>
      <div class="content" id="pages"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ═══════════ School Portal SPA ═══════════
   Slug comes from the host (<slug>.scholaxia.com) or /school/<slug>/ path. */
(function () {
  var slug = (function () {
    try {
      var q = new URLSearchParams(location.search).get("school");
      if (q) return q.toLowerCase().replace(/[^a-z0-9-]/g, "");
      var h = location.hostname.toLowerCase();
      if (h.endsWith(".scholaxia.com") && h !== "scholaxia.com" && h !== "www.scholaxia.com") return h.split(".")[0];
      var m = location.pathname.match(/\/school\/([a-z0-9-]+)/i);
      if (m) return m[1].toLowerCase();
    } catch (e) {}
    return "";
  })();

  var API = "https://scholaxia1.onrender.com/api/v1";
  if (/scholaxia1\.onrender\.com$/.test(location.hostname) || /\.scholaxia\.com$/.test(location.hostname)) {
    API = location.origin + "/api/v1";
  }

  var S = { school: null, user: null, token: localStorage.getItem("sx_portal_token_" + slug) || null, subjects: [], classes: [], cache: {} };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (n) { return "₦" + Number(n || 0).toLocaleString("en-NG"); };

  function toast(msg) { var t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, 2600); }

  function api(path, opts) {
    opts = opts || {};
    return fetch(API + "/school-portal/" + slug + path, {
      method: opts.method || "GET",
      headers: Object.assign({ "Content-Type": "application/json" }, S.token ? { Authorization: "Bearer " + S.token } : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (r) {
      if (r.status === 401) { logout(); throw new Error("Session expired — log in again."); }
      return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && d.detail) || "Request failed (" + r.status + ")");
        return d;
      });
    });
  }
  // School-office APIs (students/teachers/exams/results) live under /admin/school-office
  function officeApi(path, opts) {
    opts = opts || {};
    return fetch(API + "/admin/school-office" + path, {
      method: opts.method || "GET",
      headers: Object.assign({ "Content-Type": "application/json" }, S.token ? { Authorization: "Bearer " + S.token } : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && d.detail) || "Request failed (" + r.status + ")");
        return d;
      });
    });
  }

  /* ── LOGIN SCREEN ── */
  function initLogin() {
    if (!slug) { $("lgSchool").textContent = "School Portal"; return; }
    fetch(API + "/school-portal/" + slug + "/public").then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.name) return;
      S.school = d;
      $("lgSchool").textContent = d.name;
      document.title = d.name + " — Portal";
      $("lgLink").textContent = (d.school_type ? d.school_type.charAt(0).toUpperCase() + d.school_type.slice(1) : "") + (d.category && d.category !== "mixed" ? " · " + d.category.charAt(0).toUpperCase() + d.category.slice(1) + " only" : "");
      setLogo($("lgLogoWrap"), d.logo_url);
    }).catch(function () {});
    if (S.token) { tryEnter(); }
  }

  function setLogo(wrapEl, url) {
    if (!url) return;
    wrapEl.innerHTML = '<img src="' + esc(url) + '" alt="logo" onerror="this.parentNode.innerHTML=\'<span>🎓</span>\'" />';
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("lgBtn"), err = $("lgErr");
    err.style.display = "none";
    btn.disabled = true; btn.textContent = "Logging in…";
    fetch(API + "/school-portal/" + slug + "/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifier: $("lgId").value.trim(), password: $("lgPw").value }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (res) {
      if (!res.ok) throw new Error(res.d.detail || "Login failed");
      S.token = res.d.access_token; S.user = res.d.user; S.school = res.d.school;
      localStorage.setItem("sx_portal_token_" + slug, S.token);
      localStorage.setItem("sx_portal_user_" + slug, JSON.stringify(res.d.user));
      enter();
    }).catch(function (ex) {
      err.textContent = ex.message || "Could not log in"; err.style.display = "block";
      btn.disabled = false; btn.textContent = "→  Log In";
    });
  });

  function logout() {
    localStorage.removeItem("sx_portal_token_" + slug);
    location.reload();
  }

  function tryEnter() {
    var u = localStorage.getItem("sx_portal_user_" + slug);
    if (u) { S.user = JSON.parse(u); enter(); } else { logout(); }
  }

  /* ── APP SHELL ── */
  var PAGES = [
    ["dashboard", "🏠", "Dashboard"], ["students", "👥", "Students"], ["teachers", "👨‍🏫", "Teachers"],
    ["classes", "🎓", "Classes"], ["subjects", "📚", "Subjects"], ["exams", "📝", "Exams & CBT"],
    ["results", "📊", "Results"], ["attendance", "🗓️", "Attendance"], ["fees", "💳", "Fees & Finance"],
    ["reports", "📈", "Reports"], ["settings", "⚙️", "Settings"],
  ];

  function enter() {
    $("login").style.display = "none";
    $("app").style.display = "block";
    $("sbSchool").textContent = (S.school && S.school.name) || (S.user && S.user.school_name) || "School";
    $("sbUser").textContent = (S.user && S.user.full_name) || "";
    $("uName").textContent = (S.user && S.user.full_name) || "Admin";
    $("uAvatar").textContent = ((S.user && S.user.full_name) || "A").charAt(0).toUpperCase();
    setLogo($("sbLogoWrap"), S.school && S.school.logo_url);
    var nav = $("nav");
    nav.innerHTML = PAGES.map(function (p) {
      return '<button data-p="' + p[0] + '" onclick="showPage(\'' + p[0] + '\')"><span class="ico">' + p[1] + '</span>' + p[2] + '</button>';
    }).join("");
    showPage("dashboard");
  }
  window.showPage = function (p) {
    document.querySelectorAll(".nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.p === p); });
    if (R[p]) { try { R[p](); } catch (e) { $("pages").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; } }
  };

  function head(title, sub, btn) {
    return '<div class="page-head"><div><h1>' + title + '</h1><p>' + sub + '</p></div>' + (btn || "") + '</div>';
  }
  function statCard(ico, bg, label, val, extra) {
    return '<div class="card"><div class="cl"><div class="cico" style="background:' + bg + '">' + ico + '</div><div><div class="clab">' + label + '</div><div class="cval">' + val + '</div></div></div>' + (extra ? '<div class="muted" style="margin-top:8px;font-size:12.5px">' + extra + '</div>' : "") + '</div>';
  }
  function tbl(headers, rows) {
    if (!rows.length) return '<div class="empty">Nothing here yet.</div>';
    return '<div style="overflow-x:auto"><table><thead><tr>' + headers.map(function (h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' + rows.join("") + '</tbody></table></div>';
  }

  /* ── PAGE RENDERERS ── */
  var R = {};

  R.dashboard = function () {
    $("pages").innerHTML = head("Dashboard", "Welcome back" + (S.user ? ", " + esc(S.user.full_name.split(" ")[0]) : "") + " — here's your school at a glance.") + '<div class="cards" id="dCards"><div class="empty">Loading…</div></div>' +
      '<div class="panel"><h3>Quick actions</h3><div class="radio-row">' +
      '<label onclick="showPage(\'students\')">👥 Add / view students</label><label onclick="showPage(\'exams\')">📝 Create exam or CBT</label>' +
      '<label onclick="showPage(\'results\')">📊 Publish results</label><label onclick="showPage(\'attendance\')">🗓️ Mark attendance</label>' +
      '<label onclick="showPage(\'settings\')">⚙️ School settings</label></div></div>';
    api("/dashboard").then(function (d) {
      if (d.school) { $("sbSchool").textContent = d.school.name; }
      var st = d.stats || {};
      $("dCards").innerHTML =
        statCard("👥", "#e8f0fe", "Total Students", st.students || 0) +
        statCard("👨‍🏫", "#e7f8ee", "Teachers", st.teachers || 0) +
        statCard("📝", "#fdf3e3", "Exams & CBTs", st.exams || 0) +
        statCard("✅", "#f3e8ff", "Exam Submissions", st.exam_submissions || 0);
    }).catch(function (e) { $("dCards").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };

  R.students = function () {
    $("pages").innerHTML = head("Students", "Everyone enrolled in your school.", '<button class="btn" onclick="addStudent()">+ Add Student</button>') +
      '<div class="panel"><div class="form-grid"><div><input class="f-in" id="stQ" placeholder="Search by name, ID or email…" oninput="loadStudents()" /></div>' +
      '<div><select class="f-in" id="stCls" onchange="loadStudents()"><option value="">All classes</option></select></div></div>' +
      '<div id="stTbl"><div class="empty">Loading…</div></div></div>';
    loadStudents();
  };
  window.loadStudents = function () {
    var q = ($("stQ") && $("stQ").value) || "", cls = ($("stCls") && $("stCls").value) || "";
    officeApi("/students?q=" + encodeURIComponent(q) + (cls ? "&class_name=" + encodeURIComponent(cls) : "")).then(function (d) {
      var rows = (d.students || []).map(function (s) {
        return '<tr><td><strong>' + esc(s.full_name) + '</strong></td><td>' + esc(s.student_id || "—") + '</td><td>' + esc(s.email || "—") + '</td><td><span class="pill blue">' + esc(s.class_name || "—") + '</span></td><td>' + (s.is_active ? '<span class="pill ok">Active</span>' : '<span class="pill gray">Disabled</span>') + '</td></tr>';
      });
      $("stTbl").innerHTML = tbl(["Name", "Student ID", "Email", "Class", "Status"], rows);
      if (!$("stCls").options.length || $("stCls").options.length < 2) {
        var levels = {};
        (d.students || []).forEach(function (s) { if (s.class_name) levels[s.class_name] = 1; });
        $("stCls").innerHTML = '<option value="">All classes</option>' + Object.keys(levels).sort().map(function (l) { return '<option>' + esc(l) + '</option>'; }).join("");
        if (cls) $("stCls").value = cls;
      }
    }).catch(function (e) { $("stTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };
  window.addStudent = function () {
    var name = prompt("Student full name:"); if (!name) return;
    var cls = prompt("Class (e.g. JSS1, SS2):", "JSS1"); if (!cls) return;
    var pw = prompt("Set a password for this student (min 8 chars):"); if (!pw || pw.length < 8) { alert("Password must be at least 8 characters."); return; }
    officeApi("/students", { method: "POST", body: { full_name: name, class_name: cls, password: pw } }).then(function (d) {
      toast("Student added — Student ID: " + (d.student_id || d.id));
      loadStudents();
    }).catch(function (e) { alert(e.message); });
  };

  R.teachers = function () {
    $("pages").innerHTML = head("Teachers", "Teaching staff in your school.", '<button class="btn" onclick="addTeacher()">+ Add Teacher</button>') +
      '<div class="panel"><div id="tTbl"><div class="empty">Loading…</div></div></div>';
    officeApi("/teachers").then(function (d) {
      var rows = (d.teachers || []).map(function (t) {
        return '<tr><td><strong>' + esc(t.full_name) + '</strong></td><td>' + esc(t.email) + '</td><td>' + (t.subjects || []).map(function (s) { return '<span class="pill blue">' + esc(s) + '</span>'; }).join(" ") + '</td><td>' + esc((t.academic_classes || []).join(", ") || "—") + '</td></tr>';
      });
      $("tTbl").innerHTML = tbl(["Name", "Email", "Subjects", "Classes"], rows);
    }).catch(function (e) { $("tTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };
  window.addTeacher = function () {
    var name = prompt("Teacher full name:"); if (!name) return;
    var email = prompt("Teacher email:"); if (!email) return;
    var pw = prompt("Password (min 8 chars):"); if (!pw || pw.length < 8) { alert("Password too short."); return; }
    officeApi("/teachers", { method: "POST", body: { full_name: name, email: email, password: pw } }).then(function () {
      toast("Teacher added"); showPage("teachers");
    }).catch(function (e) { alert(e.message); });
  };

  R.classes = function () {
    $("pages").innerHTML = head("Classes", "Class groups and their sizes.", '<button class="btn" onclick="addClass()">+ Add Class</button>') +
      '<div class="panel"><div id="cTbl"><div class="empty">Loading…</div></div></div>';
    api("/classes").then(function (d) {
      var rows = (d.classes || []).map(function (c) {
        return '<tr><td><strong>' + esc(c.name) + '</strong></td><td>' + esc(c.level || "—") + '</td><td>' + (c.student_count || 0) + ' students</td><td><button class="btn sm ghost" onclick="delClass(\'' + c.id + '\')">Delete</button></td></tr>';
      });
      $("cTbl").innerHTML = tbl(["Class", "Level", "Students", ""], rows);
    }).catch(function (e) { $("cTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };
  window.addClass = function () {
    var name = prompt("Class name (e.g. JSS1 A):"); if (!name) return;
    api("/classes", { method: "POST", body: { name: name, level: name.slice(0, 4).toUpperCase() } }).then(function () { toast("Class added"); showPage("classes"); }).catch(function (e) { alert(e.message); });
  };
  window.delClass = function (id) {
    if (!confirm("Delete this class?")) return;
    api("/classes/" + id, { method: "DELETE" }).then(function () { showPage("classes"); }).catch(function (e) { alert(e.message); });
  };

  R.subjects = function () {
    $("pages").innerHTML = head("Subjects", "Manage and organize all subjects in your school.", '<button class="btn" onclick="addSubject()">+ Add Subject</button>') +
      '<div class="stat-mini" id="subStats"></div><div class="panel"><div id="subTbl"><div class="empty">Loading…</div></div></div>';
    loadSubjects();
  };
  function loadSubjects() {
    api("/subjects").then(function (d) {
      var rows = (d.subjects || []).map(function (s) {
        return '<tr><td><strong>' + esc(s.name) + '</strong></td><td>' + esc(s.code) + '</td><td><span class="pill ' + (s.subject_type === "core" ? "blue" : s.subject_type === "elective" ? "warn" : "gray") + '">' + esc(s.subject_type) + '</span></td><td>' + esc((s.class_levels || []).join(", ") || "All") + '</td><td>' + (s.is_active !== false ? '<span class="pill ok">Active</span>' : '<span class="pill gray">Inactive</span>') + '</td><td><button class="btn sm ghost" onclick="delSubject(\'' + s.id + '\')">Delete</button></td></tr>';
      });
      $("subTbl").innerHTML = tbl(["Subject", "Code", "Type", "Classes", "Status", ""], rows);
      var st = d.stats || {};
      $("subStats").innerHTML = '<span class="chip">Total: ' + (st.total || 0) + '</span><span class="chip">Active: ' + (st.active || 0) + '</span><span class="chip">Core: ' + (st.core || 0) + '</span>';
    }).catch(function (e) { $("subTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  window.loadSubjects = loadSubjects;
  window.addSubject = function () {
    var name = prompt("Subject name (e.g. Mathematics):"); if (!name) return;
    var code = prompt("Subject code (e.g. MTH):"); if (!code) return;
    var type = prompt("Type: core, general or elective:", "core"); if (!type) return;
    api("/subjects", { method: "POST", body: { name: name, code: code, subject_type: type.toLowerCase() } }).then(function () { toast("Subject added"); showPage("subjects"); }).catch(function (e) { alert(e.message); });
  };
  window.delSubject = function (id) {
    if (!confirm("Delete this subject?")) return;
    api("/subjects/" + id, { method: "DELETE" }).then(function () { showPage("subjects"); }).catch(function (e) { alert(e.message); });
  };

  R.exams = function () {
    $("pages").innerHTML = head("Exams & CBT", "Create, manage and monitor exams and CBTs.", '<button class="btn" onclick="createExam()">+ Create Exam / CBT</button>') +
      '<div class="panel"><div id="exTbl"><div class="empty">Loading…</div></div></div>';
    officeApi("/exam-counts").then(function (d) {
      var rows = (d.exams || d || []).map(function (x) {
        var st = x.is_published ? '<span class="pill ok">Active</span>' : '<span class="pill warn">Draft</span>';
        return '<tr><td><strong>' + esc(x.title) + '</strong></td><td><span class="pill blue">' + esc(x.subject || "—") + '</span></td><td>' + (x.taken_count || 0) + ' taken</td><td>' + (x.scheduled_start ? new Date(x.scheduled_start).toLocaleString() : "—") + '</td><td>' + st + '</td></tr>';
      });
      $("exTbl").innerHTML = tbl(["Exam", "Subject", "Submissions", "Scheduled", "Status"], rows);
    }).catch(function (e) { $("exTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };
  window.createExam = function () {
    var title = prompt("Exam title:"); if (!title) return;
    var subject = prompt("Subject:", "Mathematics"); if (!subject) return;
    var dur = parseInt(prompt("Duration in minutes:", "60"), 10) || 60;
    officeApi("/exams", { method: "POST", body: { title: title, subject: subject, duration_minutes: dur } }).then(function () { toast("Exam created"); showPage("exams"); }).catch(function (e) { alert(e.message); });
  };

  R.results = function () {
    $("pages").innerHTML = head("Results", "Submitted exam results (hidden from students until you publish).") +
      '<div class="panel"><div id="rTbl"><div class="empty">Loading…</div></div></div>';
    officeApi("/results").then(function (d) {
      var rows = (d.results || []).map(function (r) {
        return '<tr><td><strong>' + esc(r.student_name || "—") + '</strong></td><td>' + esc(r.exam_title || r.title || "—") + '</td><td>' + esc(r.subject || "—") + '</td><td><strong>' + esc(r.score != null ? r.score : (r.total_score != null ? r.total_score : "—")) + '</strong>' + (r.total_marks ? ' / ' + esc(r.total_marks) : "") + '</td><td>' + (r.submitted_at ? new Date(r.submitted_at).toLocaleDateString() : "—") + '</td></tr>';
      });
      $("rTbl").innerHTML = tbl(["Student", "Exam", "Subject", "Score", "Submitted"], rows);
    }).catch(function (e) { $("rTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };

  R.attendance = function () {
    $("pages").innerHTML = head("Attendance", "Mark and track daily student attendance.", '<span class="chip" id="attDate"></span>') +
      '<div class="stat-mini" id="attSum"></div><div class="panel"><div id="attTbl"><div class="empty">Loading…</div></div>' +
      '<button class="btn" style="margin-top:14px" onclick="saveAttendance()">💾 Save register</button></div>';
    window.__attMarks = {};
    api("/attendance").then(function (d) {
      $("attDate").textContent = d.date;
      var s = d.summary || {};
      $("attSum").innerHTML = '<span class="chip">Total: ' + s.total + '</span><span class="chip" style="background:var(--okbg);color:var(--ok)">Present: ' + s.present + '</span><span class="chip" style="background:var(--badbg);color:var(--bad)">Absent: ' + s.absent + '</span><span class="chip" style="background:var(--warnbg);color:var(--warn)">Late: ' + s.late + '</span>';
      var rows = (d.students || []).map(function (st, i) {
        window.__attMarks[st.student_id] = st.status;
        var opts = ["present", "absent", "late", "unmarked"].map(function (v) {
          return '<option value="' + v + '"' + (st.status === v ? " selected" : "") + '>' + v.charAt(0).toUpperCase() + v.slice(1) + '</option>';
        }).join("");
        return '<tr><td><strong>' + esc(st.full_name) + '</strong></td><td>' + esc(st.student_id) + '</td><td><span class="pill blue">' + esc(st.class_name) + '</span></td><td><select class="f-in" style="padding:7px 10px" onchange="__attMarks[\'' + esc(st.student_id) + '\']=this.value">' + opts + '</select></td></tr>';
      });
      $("attTbl").innerHTML = tbl(["Student", "ID", "Class", "Status"], rows);
    }).catch(function (e) { $("attTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };
  window.saveAttendance = function () {
    var date = ($("attDate").textContent || "").trim();
    api("/attendance", { method: "POST", body: { date: date, marks: window.__attMarks || {} } }).then(function (r) {
      toast("Register saved — " + r.marked + " students");
      showPage("attendance");
    }).catch(function (e) { alert(e.message); });
  };

  R.fees = function () {
    $("pages").innerHTML = head("Fees & Finance", "Track payments and outstanding fees.", '<button class="btn" onclick="addFee()">+ Record Payment</button>') +
      '<div class="cards" id="feeCards"></div><div class="panel"><div id="feeTbl"><div class="empty">Loading…</div></div></div>';
    api("/fees").then(function (d) {
      var st = d.stats || {};
      $("feeCards").innerHTML =
        statCard("💰", "#e8f0fe", "Total Billed", money(st.total_due)) +
        statCard("✅", "#e7f8ee", "Total Paid", money(st.total_paid), st.collection_rate + "% collected") +
        statCard("⏰", "#fdf3e3", "Outstanding", money(st.outstanding)) +
        statCard("🧾", "#f3e8ff", "Records", st.records || 0);
      var rows = (d.fees || []).map(function (f) {
        var pill = f.status === "paid" ? "ok" : f.status === "overdue" ? "bad" : "warn";
        return '<tr><td>' + esc(f.date) + '</td><td><strong>' + esc(f.student_name) + '</strong></td><td>' + esc(f.class_name || "—") + '</td><td>' + esc(f.fee_type) + '</td><td><strong>' + money(f.amount) + '</strong></td><td>' + esc(f.method) + '</td><td><span class="pill ' + pill + '">' + esc(f.status) + '</span></td></tr>';
      });
      $("feeTbl").innerHTML = tbl(["Date", "Student", "Class", "Fee type", "Amount", "Method", "Status"], rows);
    }).catch(function (e) { $("feeTbl").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };
  window.addFee = function () {
    var name = prompt("Student name:"); if (!name) return;
    var amount = parseFloat(prompt("Amount (₦):", "50000")); if (!(amount > 0)) return;
    var type = prompt("Fee type:", "School Fees") || "School Fees";
    var method = (prompt("Payment method: cash, transfer, pos or online:", "transfer") || "transfer").toLowerCase();
    var status = (prompt("Status: paid, pending or overdue:", "paid") || "paid").toLowerCase();
    api("/fees", { method: "POST", body: { student_name: name, amount: amount, fee_type: type, method: method, status: status } }).then(function () { toast("Payment recorded"); showPage("fees"); }).catch(function (e) { alert(e.message); });
  };

  R.reports = function () {
    $("pages").innerHTML = head("Reports", "Performance overview for your school.") +
      '<div class="panel" id="repBody"><div class="empty">Loading…</div></div>';
    Promise.all([api("/dashboard"), officeApi("/results")]).then(function (all) {
      var st = all[0].stats || {}; var results = all[1].results || [];
      var graded = results.filter(function (r) { return r.score != null && r.total_marks; });
      var avg = graded.length ? Math.round(graded.reduce(function (a, r) { return a + (100 * r.score / r.total_marks); }, 0) / graded.length) : null;
      $("repBody").innerHTML =
        '<div class="cards">' +
        statCard("👥", "#e8f0fe", "Students", st.students || 0) +
        statCard("📝", "#fdf3e3", "Exams", st.exams || 0) +
        statCard("✅", "#e7f8ee", "Submissions", st.exam_submissions || 0) +
        statCard("📈", "#f3e8ff", "Average Score", avg == null ? "—" : avg + "%") +
        '</div><p class="muted">Based on ' + graded.length + ' graded submissions. Term reports, class rankings and PDF exports are added as results accumulate.</p>';
    }).catch(function (e) { $("repBody").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };

  R.settings = function () {
    $("pages").innerHTML = head("Settings", "Your school information.") + '<div class="panel" id="setBody"><div class="empty">Loading…</div></div>';
    api("/settings").then(function (d) {
      var s = d.school || {};
      $("setBody").innerHTML =
        '<div class="form-grid">' +
        '<div><label class="f-label">School name</label><input class="f-in" value="' + esc(s.name) + '" disabled /></div>' +
        '<div><label class="f-label">Private link</label><input class="f-in" value="' + esc(d.private_link || "") + '" disabled /></div>' +
        '<div><label class="f-label">Type</label><input class="f-in" value="' + esc((s.school_type || "—") + (s.category && s.category !== "mixed" ? " · " + s.category + " only" : " · Mixed")) + '" disabled /></div>' +
        '<div><label class="f-label">Location</label><input class="f-in" value="' + esc([s.city, s.state].filter(Boolean).join(", ") || "—") + '" disabled /></div>' +
        '<div><label class="f-label">Contact email</label><input class="f-in" id="setEmail" value="' + esc(s.contact_email || "") + '" /></div>' +
        '<div><label class="f-label">Contact phone</label><input class="f-in" id="setPhone" value="' + esc(s.contact_phone || "") + '" /></div>' +
        '<div class="full"><label class="f-label">Address</label><input class="f-in" id="setAddr" value="' + esc(s.address || "") + '" /></div>' +
        '</div><button class="btn" onclick="saveSettings()">💾 Save changes</button>' +
        '<p class="muted" style="margin-top:12px">School name, link and logo are managed by the main Scholaxia admin — contact support to change them.</p>';
    }).catch(function (e) { $("setBody").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  };
  window.saveSettings = function () {
    api("/settings", { method: "PATCH", body: { address: $("setAddr").value, contact_email: $("setEmail").value, contact_phone: $("setPhone").value } }).then(function () { toast("Settings saved"); }).catch(function (e) { alert(e.message); });
  };

  /* ── BOOT ── */
  initLogin();
})();
</script>
</body>
</html>
