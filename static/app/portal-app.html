<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>School Portal — Scholaxia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#0d1b3e; --navy2:#122550; --navy3:#0a1734; --blue:#1a6ef5; --blue2:#0f56d6;
  --sky:#eaf2ff; --ink:#152242; --mut:#5d6b8a; --line:#e3e9f4; --bg:#f4f7fd;
  --ok:#16a34a; --okbg:#e7f8ee; --warn:#d97706; --warnbg:#fdf3e3; --bad:#dc2626; --badbg:#fdeaea;
  --card:#ffffff; --rad:16px; --sh:0 2px 14px rgba(21,34,66,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14.5px}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#eef4ff 0%,#dfe9fb 55%,#cddcf7 100%);padding:24px}
.login-wrap{display:grid;grid-template-columns:440px minmax(320px,560px);max-width:1020px;width:100%;background:linear-gradient(160deg,#f6faff 0%,#e8f1fd 100%);border-radius:24px;box-shadow:0 24px 70px rgba(13,27,62,.18);overflow:hidden}
.login-hero{display:flex;align-items:flex-end;justify-content:center;padding:10px 10px 0;background:radial-gradient(120% 90% at 70% 10%,#dcebfe 0%,#c6dcf9 60%,#b3cff5 100%);min-height:560px}
.login-hero img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.login-card{background:transparent;border-radius:0;box-shadow:none;max-width:none;width:100%;padding:44px 42px}
@media(max-width:860px){.login-wrap{grid-template-columns:1fr}.login-hero{display:none}.login-card{padding:34px 26px}}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-brand img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--sky)}
.login-brand .fallback-logo{width:52px;height:52px;border-radius:12px;background:var(--navy);color:#f7c948;display:flex;align-items:center;justify-content:center;font-size:26px}
.login-brand h1{font-size:20px;font-weight:800;color:var(--navy);line-height:1.15}
.login-brand small{color:var(--mut);font-size:12px}
.login-card h2{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:6px}
.login-card .sub{color:var(--mut);margin-bottom:24px;line-height:1.45}
.f-label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px;color:var(--navy)}
.f-in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;outline:none;background:#fbfcff;transition:border .15s}
.f-in:focus{border-color:var(--blue);background:#fff}
textarea.f-in{resize:vertical;min-height:60px}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 18px;font-size:13.5px;color:var(--mut)}
.btn-login{width:100%;padding:13px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;transition:background .15s}
.btn-login:hover{background:var(--blue2)}
.btn-login[disabled]{opacity:.65;cursor:wait}
.login-err{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:13.5px}
.login-foot{margin-top:20px;text-align:center;color:#9aa7c2;font-size:12.5px}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy3) 100%);color:#cfd9ee;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .blogo{width:44px;height:44px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.brand .blogo img{width:100%;height:100%;object-fit:cover}
.brand .blogo span{font-size:22px}
.brand h3{color:#fff;font-size:15.5px;font-weight:700;line-height:1.2}
.brand small{color:#8fa3c8;font-size:11px}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#c2cee6;padding:11px 13px;border-radius:10px;font-size:14.5px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--blue);color:#fff;font-weight:600}
.nav .ico{width:20px;text-align:center;flex:none}
.side-foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#8fa3c8;line-height:1.6}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.topbar .search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 14px;color:var(--mut)}
.topbar .search input{border:none;background:none;outline:none;flex:1;color:var(--ink)}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.who .nm{font-weight:700;font-size:14px;line-height:1.1}
.who .rl{color:var(--mut);font-size:12px}
.content{padding:26px;max-width:1200px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800;color:var(--navy)}
.page-head p{color:var(--mut);margin-top:3px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:none;border-radius:11px;background:var(--blue);color:#fff;font-weight:600;font-size:14.5px}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.green{background:var(--ok)}.btn.green:hover{background:#128a3e}
.btn.red{background:var(--bad)}.btn.red:hover{background:#b91c1c}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.6;cursor:wait}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:18px}
.card .cl{display:flex;gap:12px;align-items:center}
.card .cico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.card .clab{color:var(--mut);font-size:13px}
.card .cval{font-size:26px;font-weight:800;color:var(--navy)}
.panel{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;margin-bottom:20px}
.panel h3{font-size:16.5px;margin-bottom:14px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1.5px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.blue{background:var(--sky);color:var(--blue)}
.pill.gray{background:#eef1f7;color:var(--mut)}
.pill.violet{background:#f3e8ff;color:#7c3aed}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-grid .full{grid-column:1/-1}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.muted{color:var(--mut)}
.stat-mini{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--sky);color:var(--blue);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600}
.chip.g{background:var(--okbg);color:var(--ok)}.chip.w{background:var(--warnbg);color:var(--warn)}.chip.r{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:none;padding:11px 16px;font-size:14px;font-weight:600;color:var(--mut);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;cursor:pointer;background:#fbfcff}
#toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:999;box-shadow:0 10px 30px rgba(13,27,62,.3);max-width:420px}
/* ═══ MOBILE RESPONSIVENESS ═══ */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:60;width:250px;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .sidebar-open::before{content:"";position:fixed;inset:0;background:rgba(13,27,62,.45);z-index:55}
  .content{padding:16px 12px}
  .topbar{padding:10px 12px;gap:8px}
  .topbar .search{padding:8px 12px}
  .who .nm,.who .rl{display:none}
}
@media(max-width:720px){
  body{font-size:14.5px}
  .content{padding:12px 10px}
  .page-head h1{font-size:21px}
  .page-head p{font-size:13px}
  .cards{gap:10px}
  .card{padding:14px}
  .card .cval{font-size:21px}
  .panel{padding:14px;border-radius:14px}
  /* Tabs (incl. Exams sub-tabs) — swipeable pill row instead of clipped underline tabs */
  .tabs{display:flex;gap:7px;border-bottom:none;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:8px 14px;font-size:13px;margin-bottom:0}
  .tabs button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
  /* Form grids collapse to one column */
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
  /* Tables: keep data readable without horizontal pinch-zoom */
  table{font-size:13px}
  th,td{padding:9px 8px}
  td{white-space:normal}
  td code{font-size:12px;word-break:break-all}
  td[style*="white-space:nowrap"]{white-space:normal!important}
  td[style*="white-space:nowrap"] .btn{margin:2px 0}
  td .btn.sm{padding:6px 10px;font-size:12px}
  .stat-mini{gap:6px}
  .chip{padding:5px 11px;font-size:11.5px}
  .radio-row label{padding:8px 10px;font-size:12.5px}
  /* Modals become full-width sheets */
  .mb-back{padding:0;align-items:flex-end}
  .mb-modal{max-height:94vh;border-radius:18px 18px 0 0}
  .mb-modal.wide{max-width:100%}
  .mb-body{padding:14px 16px}
  .mb-head{padding:14px 16px 0}
  .mb-foot{padding:12px 16px 14px;flex-wrap:wrap}
  .mb-foot .btn{flex:1;justify-content:center}
  .mb-foot .btn + .btn{margin-left:0}
  .qrow .opts{grid-template-columns:1fr}
}
@media(max-width:480px){
  .content{padding:10px 8px}
  .panel{padding:12px}
  .btn{padding:10px 14px;font-size:13.5px}
  .btn.sm{padding:6px 10px;font-size:12px}
  .page-head h1{font-size:19px}
  .card .cval{font-size:19px}
  .topbar .search{max-width:none}
}

/* ═══ MOBILE NAV (hamburger for the sidebar) ═══ */
.mob-menu-btn{display:none;background:#fff;border:1.5px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:19px;color:var(--navy);flex:none;align-items:center;justify-content:center}
@media(max-width:900px){
  .mob-menu-btn{display:flex}
  .topbar .search{flex:1}
}
@media(max-width:560px){
  .topbar .search{display:none}
}
@media print{.sidebar,.topbar,#toast{display:none!important}.content{padding:0}}

/* ── MODALS ── */
.mb-back{position:fixed;inset:0;background:rgba(13,27,62,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:500;padding:18px}
.mb-modal{background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(13,27,62,.35);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:mbin .16s ease-out}
.mb-modal.wide{max-width:760px}
@keyframes mbin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.mb-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.mb-head h3{font-size:18px;color:var(--navy);font-weight:800}
.mb-x{background:#f1f4fa;border:none;border-radius:9px;width:32px;height:32px;font-size:14px;color:var(--mut)}
.mb-x:hover{background:#e6ebf5;color:var(--ink)}
.mb-body{padding:16px 22px;overflow-y:auto}
.mb-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.mrow{margin-bottom:13px}
.mrow .f-label{margin:0 0 5px}
.mhint{font-size:12.5px;color:var(--mut);margin-top:4px}
.merr{display:none;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--badbg);color:var(--bad);font-size:13px}
.mnote{background:var(--okbg);border:1px solid #bfe8cf;color:#116a35;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6}
.mnote code{background:#fff;border:1px solid #bfe8cf;border-radius:6px;padding:2px 7px;font-size:13px;font-weight:700}
.qrow{border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:#fbfcff}
/* Exams & CBT — local sidebar (each function its own tab, reference UI) */
.exside-wrap{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.exside{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:12px;position:sticky;top:86px}
.exside button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink)}
.exside button:hover{background:var(--sky)}
.exside button.on{background:var(--blue);color:#fff;font-weight:600}
.exside-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:6px 12px 4px}
.exmain{min-width:0}
@media(max-width:900px){
  .exside-wrap{grid-template-columns:1fr;gap:12px}
  .exside{position:static;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px;scrollbar-width:none}
  .exside::-webkit-scrollbar{display:none}
  .exside button{white-space:nowrap;width:auto;flex:none;border:1.5px solid var(--line);background:#fff}
  .exside button.on{border-color:var(--blue);background:var(--blue)}
  .exside-label{display:none}
}
/* Upload Results: one flex row per student (wraps on small screens) */  .up-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .rg3{grid-template-columns:1fr 1fr 1fr}
  .rg2{grid-template-columns:1fr 1fr}
  @media(max-width:860px){.rg3,.rg2{grid-template-columns:1fr}}
.up-row .f-in{flex:1;min-width:150px}
.up-row input[type=number]{flex:0 0 90px;min-width:90px}
.qrow .qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qrow .qtop b{font-size:13px;color:var(--blue)}
.qrow .opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.qrow .opt{display:flex;align-items:center;gap:8px}
.qrow .opt b{font-size:12.5px;color:var(--mut);width:16px}
.doc-pill{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--blue);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;text-decoration:none}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login">
  <div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="blogo" id="lgLogoWrap"><span>🎓</span></div>
      <div><h1 id="lgSchool">School Portal</h1><small>Scholaxia School Platform</small></div>
    </div>
    <h2>Welcome back!</h2>
    <p class="sub">Log in to your school account and manage students, exams, results and more.</p>
    <form id="loginForm">
      <label class="f-label" for="lgId">Email or phone number</label>
      <input class="f-in" id="lgId" autocomplete="username" placeholder="admin@yourschool.com" required />
      <label class="f-label" for="lgPw">Password</label>
      <input class="f-in" id="lgPw" type="password" autocomplete="current-password" placeholder="Enter your password" required />
      <div class="login-row"><label><input type="checkbox" checked style="accent-color:var(--blue)" /> Remember me</label><a href="#" onclick="return false" style="color:var(--blue);text-decoration:none">Forgot password?</a></div>
      <button class="btn-login" id="lgBtn" type="submit">→&nbsp; Log In</button>
      <div class="login-err" id="lgErr"></div>
    </form>
    <p class="login-foot">Powered by Scholaxia · <span id="lgLink"></span></p>
  </div>
  <div class="login-hero"><img src="media/portal-login-hero.png" alt="" /></div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="blogo" id="sbLogoWrap"><span>🎓</span></div>
        <div><h3 id="sbSchool">School</h3><small id="sbTag">Scholaxia School Platform</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">Better learning today,<br/>brighter futures tomorrow.<br/><span id="sbUser" style="color:#c2cee6"></span></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="mob-menu-btn" onclick="toggleMobNav()" aria-label="Open menu">☰</button>
        <div class="search">🔍 <input id="gSearch" placeholder="Search students… (press Enter)" /></div>
        <div class="who"><div class="avatar" id="uAvatar">A</div><div><div class="nm" id="uName">—</div><div class="rl">School Admin</div></div>
          <button class="btn sm ghost" onclick="logout()" style="margin-left:8px">Log out</button></div>
      </div>
      <div class="content" id="pages"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ═══════════ School Portal SPA ═══════════
   Slug comes from the host (<slug>.scholaxia.com) or /school/<slug>/ path. */
(function () {
  var slug = (function () {
    try {
      var q = new URLSearchParams(location.search).get("school");
      if (q) return q.toLowerCase().replace(/[^a-z0-9-]/g, "");
      var h = location.hostname.toLowerCase();
      if (h.endsWith(".scholaxia.com") && h !== "scholaxia.com" && h !== "www.scholaxia.com") return h.split(".")[0];
      var m = location.pathname.match(/\/school\/([a-z0-9-]+)/i);
      if (m) return m[1].toLowerCase();
    } catch (e) {}
    return "";
  })();

  var API = "https://scholaxia1.onrender.com/api/v1";
  if (/scholaxia1\.onrender\.com$/.test(location.hostname) || /\.scholaxia\.com$/.test(location.hostname)) {
    API = location.origin + "/api/v1";
  }

  var S = { school: null, user: null, token: localStorage.getItem("sx_portal_token_" + slug) || null, cache: {} };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (n) { return "₦" + Number(n || 0).toLocaleString("en-NG"); };

  function toast(msg) { var t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, 3000); }

  /* Friendly error text — never "[object Object]" */
  function errText(e) {
    if (e == null) return "Something went wrong";
    if (typeof e === "string") return e;
    var raw = e.message != null ? e.message : null;
    if (raw != null) {
      var s = String(raw);
      if (s === "[object Object]" || s === "[object Undefined]") { try { s = JSON.stringify(e); } catch (_) { s = ""; } }
      try {
        var arr = JSON.parse(s);
        if (Array.isArray(arr)) {
          return arr.map(function (v) { return (v && v.msg ? v.msg : "") + (v && v.loc && v.loc.length ? " (" + v.loc.join(".") + ")" : ""); }).filter(Boolean).join("; ") || "Invalid input";
        }
      } catch (_) {}
      if (s.indexOf("[object") === 0) { try { s = JSON.stringify(e); } catch (_) {} }
      return s || "Something went wrong";
    }
    try { return JSON.stringify(e); } catch (_) { return "Something went wrong"; }
  }
  function detailOf(d) {
    if (!d) return null;
    var det = d.detail != null ? d.detail : (d.message != null ? d.message : null);
    if (det == null) return null;
    if (typeof det === "string") return det;
    if (Array.isArray(det)) return det.map(function (v) { return v && v.msg ? v.msg + (v.loc ? " (" + v.loc.join(".") + ")" : "") : ""; }).filter(Boolean).join("; ") || "Invalid input";
    try { return det.msg || JSON.stringify(det); } catch (_) { return "Request failed"; }
  }
  function toastErr(e) { toast("⚠️ " + errText(e)); }

  function _headers(json) {

  }
  function _handle(r) {
    return r.text().then(function (txt) {
      var d = null;

      if (r.status === 401 && S.token) { logout(); throw new Error("Session expired — log in again."); }
      if (!r.ok) throw new Error(detailOf(d) || ("Request failed (" + r.status + ")"));
      return d;
    });
  }

    if (!when) { err.textContent = "Pick the start date and time."; err.style.display = "block"; return; }

      var targets = (d.schedule || []).filter(function (r) { return r.class_name === cls && subs.indexOf(r.subjects) >= 0; });

          toastErr(e);
        });

      '<input class="f-in up-ca" type="number" min="0" step="0.5" placeholder="CA" value="' + (ca != null ? ca : "") + '" style="max-width:90px" />' +
      '<input class="f-in up-ex" type="number" min="0" step="0.5" placeholder="Exam" value="' + (ex != null ? ex : "") + '" style="max-width:90px" />' +
      '<button class="mb-x" onclick="this.parentNode.remove()" title="Remove" style="width:30px;height:30px;flex:none">✕</button>';
    box.appendChild(div);
  };
  window.upLoadSheet = function () {
    var cls = ($("upCls").value || "").trim().toUpperCase(), subj = ($("upSubj").value || "").trim();
    if (!cls || !subj) return toastErr("Enter class and subject first, then load the sheet.");
    api("/" + slug + "/results/upload?class_name=" + encodeURIComponent(cls)).then(function (d) {
      var sheet = (d.sheets || []).filter(function (s) { return (s.subject || "").toLowerCase() === subj.toLowerCase(); })[0];
      $("upRows").innerHTML = "";
      if (sheet) {
        $("upTerm").value = sheet.term || ""; $("upSession").value = sheet.session || ""; $("upMax").value = sheet.max_score || 100;
        (sheet.rows || []).forEach(function (r) { upAddRow(r.student_name, r.reg_number, r.ca, r.exam); });
        toast("Loaded existing sheet — saving replaces it");
      } else { toast("No existing sheet — filling a new one"); }
      if (!$("upRows").children.length) upAddRow();
    }).catch(toastErr);
  };
  window.upSave = function () {
    var cls = ($("upCls").value || "").trim(), subj = ($("upSubj").value || "").trim();
    if (!cls) return toastErr("Enter the class.");
    if (!subj) return toastErr("Enter the subject.");
    var rows = [];
    document.querySelectorAll("#upRows .up-row").forEach(function (row) {
      var nm = row.querySelector(".up-name").value.trim();
      if (!nm) return;
      rows.push({ student_name: nm, reg_number: row.querySelector(".up-reg").value.trim() || null,
        ca: parseFloat(row.querySelector(".up-ca").value) || 0, exam: parseFloat(row.querySelector(".up-ex").value) || 0 });
    });
    if (!rows.length) return toastErr("Add at least one student with a name.");
    api("/" + slug + "/results/upload", { method: "POST", body: {
      class_name: cls, subject: subj, term: $("upTerm").value, session: $("upSession").value.trim(),
      max_score: parseFloat($("upMax").value) || 100, rows: rows,
    } }).then(function (d) {
      toast("✓ Result sheet saved — " + d.sheet.count + " students, grades computed");
      upSheets();
    }).catch(toastErr);
  };
  function upSheets() {
    api("/" + slug + "/results/upload").then(function (d) {
      var sheets = d.sheets || [];
      var box = $("upSheets"); if (!box) return;
      if (!sheets.length) { box.innerHTML = '<div class="empty">No sheets uploaded yet.</div>'; return; }
      box.innerHTML = tbl(["Class", "Subject", "Term", "Session", "Students", "Uploaded", ""], sheets.map(function (s) {
        return '<tr><td><span class="pill violet">' + esc(s.class_name) + '</span></td><td><span class="pill blue">' + esc(s.subject) + '</span></td><td>' + esc(s.term || "—") + '</td><td>' + esc(s.session || "—") + '</td><td>' + s.count + '</td><td>' + dOnly(s.uploaded_at) + '</td>' +
          '<td style="white-space:nowrap"><button class="btn sm ghost" onclick="upView(\'' + s.id + '\')">👁 View</button> <button class="btn sm red" onclick="upDel(\'' + s.id + '\')">Delete</button></td></tr>';
      }));
    }).catch(function (e) { var b = $("upSheets"); if (b) b.innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  }
  window.upView = function (id) {
    api("/" + slug + "/results/upload").then(function (d) {
      var s = (d.sheets || []).filter(function (x) { return x.id === id; })[0];
      if (!s) return;
      openModal("Result sheet — " + esc(s.class_name) + " · " + esc(s.subject),
        tbl(["Student", "Reg Number", "CA", "Exam", "Total", "%", "Grade"], (s.rows || []).map(function (r) {
          return '<tr><td><strong>' + esc(r.student_name) + '</strong></td><td>' + esc(r.reg_number || "—") + '</td><td>' + r.ca + '</td><td>' + r.exam + '</td><td><strong>' + r.total + '</strong></td><td>' + r.percentage + '%</td><td><span class="pill ' + (r.percentage >= 50 ? "ok" : "bad") + '">' + esc(r.grade) + '</span></td></tr>';
        })), '<button class="btn ghost" onclick="closeModal()">Close</button>', true);
    }).catch(toastErr);
  };
  window.upDel = function (id) {
    confirmModal("Delete sheet", "Delete this uploaded result sheet?", function (btn) {
      busy(btn, true);
      api("/" + slug + "/results/upload/" + id, { method: "DELETE" }).then(function () {
        closeModal(); toast("Sheet deleted"); upSheets();
      }).catch(function (e) { busy(btn, false, "Confirm"); mErr(errText(e)); });
    }, "Delete", true);
  };

  /* ═══ RESULTS (legacy CBT practice results) ═══ */
  R.results = function () {
    $("pages").innerHTML = head("Results", "Submitted exam results (hidden from students until you publish).") +
      '<div class="panel"><div class="form-grid"><div><select class="f-in" id="rSubj" onchange="loadResults()"><option value="">All subjects</option></select></div></div>' +
      '<div id="rTbl"><div class="empty">Loading…</div></div></div>';
    loadResults();
  };
  window.loadResults = function () {
    var subj = ($("rSubj") && $("rSubj").value) || "";
    officeApi("/results" + (subj ? "?subject=" + encodeURIComponent(subj) : "")).then(function (d) {
      var list = d.results || [];
      var subs = {};
      list.forEach(function (r) { if (r.subject) subs[r.subject] = 1; });
      var sel = $("rSubj");
      if (sel && sel.options.length < 2) {
        sel.innerHTML = '<option value="">All subjects</option>' + Object.keys(subs).sort().map(function (s) { return '<option>' + esc(s) + '</option>'; }).join("");
        if (subj) sel.value = subj;
      }
      var rows = list.map(function (r) {
        var pct = (r.score != null && r.total_marks) ? Math.round(100 * r.score / r.total_marks) + "%" : "—";
        return '<tr><td><strong>' + esc(r.student_name || "—") + '</strong></td><td>' + esc(r.exam_title || r.title || "—") + '</td><td><span class="pill blue">' + esc(r.subject || "—") + '</span></td><td><strong>' + esc(r.score != null ? r.score : "—") + '</strong>' + (r.total_marks ? ' / ' + esc(r.total_marks) : "") + '</td><td>' + pct + '</td><td>' + dOnly(r.submitted_at) + '</td></tr>';
      });
      $("rTbl").innerHTML = tbl(["Student", "Exam", "Subject", "Score", "Percent", "Submitted"], rows);
    }).catch(function (e) { $("rTbl").innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  };

  /* ═══ ATTENDANCE ═══ */
  window.__attMarks = {};
  R.attendance = function () {
    var today = new Date().toISOString().slice(0, 10);
    $("pages").innerHTML = head("Attendance", "Mark and track daily student attendance.",
        '<input class="f-in" type="date" id="attDateIn" value="' + today + '" max="' + today + '" style="width:170px" onchange="loadAttendance(this.value)" /><button class="btn ghost" onclick="markAllPresent()">✓ All present</button>') +
      '<div class="stat-mini" id="attSum"></div><div class="panel"><div id="attTbl"><div class="empty">Loading…</div></div>' +
      '<div style="margin-top:14px;display:flex;gap:10px"><button class="btn" onclick="saveAttendance()">💾 Save register</button><span class="muted" id="attSaved" style="align-self:center;font-size:13px"></span></div></div>';
    loadAttendance(today);
  };
  window.loadAttendance = function (date) {
    window.__attMarks = {};
    api("/attendance" + (date ? "?date=" + encodeURIComponent(date) : "")).then(function (d) {
      var s = d.summary || {};
      $("attSum").innerHTML = '<span class="chip">Total: ' + s.total + '</span><span class="chip g">Present: ' + s.present + '</span><span class="chip r">Absent: ' + s.absent + '</span><span class="chip w">Late: ' + s.late + '</span><span class="chip">' + (d.date || "") + '</span>';
      var rows = (d.students || []).map(function (st) {
        window.__attMarks[st.student_id] = st.status;
        var opts = ["unmarked", "present", "absent", "late"].map(function (v) {
          return '<option value="' + v + '"' + (st.status === v ? " selected" : "") + '>' + (v === "unmarked" ? "—" : v.charAt(0).toUpperCase() + v.slice(1)) + '</option>';
        }).join("");
        return '<tr><td><strong>' + esc(st.full_name) + '</strong></td><td><span class="pill violet">' + esc(st.student_id) + '</span></td><td><span class="pill blue">' + esc(st.class_name) + '</span></td><td><select class="f-in" style="padding:7px 10px;width:130px" onchange="setMark(\'' + esc(st.student_id) + '\', this.value)">' + opts + '</select></td></tr>';
      });
      $("attTbl").innerHTML = rows.length ? tbl(["Student", "ID", "Class", "Status"], rows) : '<div class="empty">No students yet — add students first.</div>';
    }).catch(function (e) { $("attTbl").innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  };
  window.setMark = function (sid, v) { window.__attMarks[sid] = v; $("attSaved").textContent = "Unsaved changes"; };
  window.markAllPresent = function () {
    Object.keys(window.__attMarks).forEach(function (k) { window.__attMarks[k] = "present"; });
    document.querySelectorAll("#attTbl select").forEach(function (s) { s.value = "present"; });
    $("attSaved").textContent = "Unsaved changes";
  };
  window.saveAttendance = function () {
    var date = ($("attDateIn") && $("attDateIn").value) || new Date().toISOString().slice(0, 10);
    api("/attendance", { method: "POST", body: { date: date, marks: window.__attMarks || {} } }).then(function (r) {
      toast("Register saved — " + r.marked + " students");
      $("attSaved").textContent = "Saved ✓";
      loadAttendance(date);
    }).catch(toastErr);
  };

  /* ═══ FEES & FINANCE ═══ */
  R.fees = function () {
    $("pages").innerHTML = head("Fees & Finance", "Track payments and outstanding fees.", '<button class="btn" onclick="addFee()">+ Record Payment</button>') +
      '<div class="cards" id="feeCards"></div><div class="panel"><div id="feeTbl"><div class="empty">Loading…</div></div></div>';
    Promise.all([api("/fees"), officeApi("/students")]).then(function (all) {
      var d = all[0];
      window.__students = (all[1].students || []);
      var st = d.stats || {};
      $("feeCards").innerHTML =
        statCard("💰", "#e8f0fe", "Total Billed", money(st.total_due)) +
        statCard("✅", "#e7f8ee", "Total Paid", money(st.total_paid), (st.collection_rate || 0) + "% collected") +
        statCard("⏰", "#fdf3e3", "Outstanding", money(st.outstanding)) +
        statCard("🧾", "#f3e8ff", "Records", st.records || 0);
      var rows = (d.fees || []).map(function (f) {
        var pill = f.status === "paid" ? "ok" : f.status === "overdue" ? "bad" : "warn";
        var act = '<button class="btn sm ghost" onclick="feeStatus(\'' + f.id + '\',\'paid\')">Mark paid</button> ' +
          '<button class="btn sm red" onclick="delFee(\'' + f.id + '\')">Delete</button>';
        return '<tr><td>' + dOnly(f.date) + '</td><td><strong>' + esc(f.student_name) + '</strong></td><td>' + esc(f.class_name || "—") + '</td><td>' + esc(f.fee_type) + '</td><td><strong>' + money(f.amount) + '</strong></td><td>' + esc(f.method) + '</td><td><span class="pill ' + pill + '">' + esc(f.status) + '</span></td><td style="white-space:nowrap">' + act + '</td></tr>';
      });
      $("feeTbl").innerHTML = tbl(["Date", "Student", "Class", "Fee type", "Amount", "Method", "Status", ""], rows);
    }).catch(function (e) { $("feeTbl").innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  };
  window.addFee = function () {
    openModal("Record Payment",
      '<div class="mrow"><label class="f-label">Student *</label><input class="f-in" id="feeName" list="feeStuds" placeholder="Pick or type a name" /><datalist id="feeStuds">' +
      (window.__students || []).map(function (s) { return '<option value="' + esc(s.full_name) + '">'; }).join("") + '</datalist></div>' +
      '<div class="form-grid"><div><label class="f-label">Amount (₦) *</label><input class="f-in" id="feeAmt" type="number" min="1" placeholder="50000" /></div>' +
      '<div><label class="f-label">Fee type</label><select class="f-in" id="feeType"><option>School Fees</option><option>Exam Fee</option><option>Books</option><option>Uniform</option><option>Transport</option><option>Other</option></select></div></div>' +
      '<div class="form-grid"><div><label class="f-label">Method</label><select class="f-in" id="feeMethod"><option value="transfer">Bank transfer</option><option value="cash">Cash</option><option value="pos">POS</option><option value="online">Online</option></select></div>' +
      '<div><label class="f-label">Status</label><select class="f-in" id="feeStatusSel"><option value="paid">Paid</option><option value="pending">Pending</option><option value="overdue">Overdue</option></select></div></div>' +
      '<div class="merr"></div>',
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="feeSave">Save payment</button>');
    $("feeSave").addEventListener("click", function () {
      var name = $("feeName").value.trim(), amt = parseFloat($("feeAmt").value);
      if (!name) return mErr("Enter the student's name.");
      if (!(amt > 0)) return mErr("Enter a valid amount.");
      busy($("feeSave"), true);
      var stu = (window.__students || []).find(function (s) { return s.full_name.toLowerCase() === name.toLowerCase(); });
      api("/fees", { method: "POST", body: { student_name: name, amount: amt, fee_type: $("feeType").value, method: $("feeMethod").value, status: $("feeStatusSel").value,
        student_id: stu ? stu.student_id : null, class_name: stu ? stu.class_name : null } }).then(function () {
        closeModal(); toast("Payment recorded"); showPage("fees");
      }).catch(function (e) { busy($("feeSave"), false, "Save payment"); mErr(errText(e)); });
    });
  };
  window.feeStatus = function (feeId, status) {
    api("/fees/" + feeId + "?status=" + status, { method: "PATCH" }).then(function () { toast("Updated"); showPage("fees"); }).catch(toastErr);
  };
  window.delFee = function (feeId) {
    confirmModal("Delete record", "Remove this fee record? The student's payment history loses this entry.", function (btn) {
      busy(btn, true);
      api("/fees/" + feeId, { method: "DELETE" }).then(function () { closeModal(); toast("Record deleted"); showPage("fees"); })
        .catch(function (e) { busy(btn, false, "Delete"); mErr(errText(e)); });
    }, "Delete", true);
  };

  /* ═══ REPORTS ═══ */
  R.reports = function () {
    $("pages").innerHTML = head("Reports", "Performance overview for your school.") +
      '<div class="panel" id="repBody"><div class="empty">Loading…</div></div>';
    Promise.all([api("/dashboard"), officeApi("/results")]).then(function (all) {
      var st = all[0].stats || {}; var results = all[1].results || [];
      var graded = results.filter(function (r) { return r.score != null && r.total_marks; });
      var avg = graded.length ? Math.round(graded.reduce(function (a, r) { return a + (100 * r.score / r.total_marks); }, 0) / graded.length) : null;
      var bySubj = {};
      graded.forEach(function (r) {
        var k = r.subject || "General";
        (bySubj[k] = bySubj[k] || []).push(100 * r.score / r.total_marks);
      });
      var subjRows = Object.keys(bySubj).sort().map(function (k) {
        var arr = bySubj[k];
        var a = Math.round(arr.reduce(function (x, y) { return x + y; }, 0) / arr.length);
        var pill = a >= 70 ? "ok" : a >= 50 ? "warn" : "bad";
        return '<tr><td><strong>' + esc(k) + '</strong></td><td>' + arr.length + '</td><td><span class="pill ' + pill + '">' + a + '% average</span></td></tr>';
      });
      $("repBody").innerHTML =
        '<div class="cards">' +
        statCard("👥", "#e8f0fe", "Students", st.students || 0) +
        statCard("📝", "#fdf3e3", "Exams", st.exams || 0) +
        statCard("✅", "#e7f8ee", "Submissions", st.exam_submissions || 0) +
        statCard("📈", "#f3e8ff", "Average Score", avg == null ? "—" : avg + "%") +
        '</div>' +
        '<div class="panel"><h3>Performance by subject</h3>' +
        (subjRows.length ? tbl(["Subject", "Submissions", "Average"], subjRows) : '<div class="empty">No graded submissions yet.</div>') + '</div>';
    }).catch(function (e) { $("repBody").innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  };

  /* ═══ SETTINGS ═══ */
  R.settings = function () {
    $("pages").innerHTML = head("Settings", "Your school information.") + '<div class="panel" id="setBody"><div class="empty">Loading…</div></div>';
    api("/settings").then(function (d) {
      var s = d.school || {};
      $("setBody").innerHTML =
        '<div class="form-grid">' +
        '<div><label class="f-label">School name</label><input class="f-in" value="' + esc(s.name) + '" disabled /></div>' +
        '<div><label class="f-label">Private link</label><input class="f-in" value="' + esc(d.private_link || "") + '" disabled /></div>' +
        '<div><label class="f-label">Type</label><input class="f-in" value="' + esc((s.school_type || "—") + (s.category && s.category !== "mixed" ? " · " + s.category + " only" : " · Mixed")) + '" disabled /></div>' +
        '<div><label class="f-label">Location</label><input class="f-in" value="' + esc([s.city, s.state].filter(Boolean).join(", ") || "—") + '" disabled /></div>' +
        '<div><label class="f-label">Contact email</label><input class="f-in" id="setEmail" value="' + esc(s.contact_email || "") + '" /></div>' +
        '<div><label class="f-label">Contact phone</label><input class="f-in" id="setPhone" value="' + esc(s.contact_phone || "") + '" /></div>' +
        '<div class="full"><label class="f-label">Address</label><input class="f-in" id="setAddr" value="' + esc(s.address || "") + '" /></div>' +
        '</div><button class="btn" onclick="saveSettings(this)">💾 Save changes</button>' +
        '<p class="muted" style="margin-top:12px">School name, private link and logo are managed by the main Scholaxia admin — contact support to change them.</p>';
    }).catch(function (e) { $("setBody").innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  };
  window.saveSettings = function (btn) {
    busy(btn, true);
    api("/settings", { method: "PATCH", body: { address: $("setAddr").value, contact_email: $("setEmail").value, contact_phone: $("setPhone").value } })
      .then(function () { busy(btn, false, "💾 Save changes"); toast("Settings saved"); })
      .catch(function (e) { busy(btn, false, "💾 Save changes"); toastErr(e); });
  };

  /* ── BOOT ── */
  initLogin();
})();
</script>
</body>
</html>
