<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sia — Scholaxia AI Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="chat.css?v=1.0" />
  <style>
    /* Fallback basic styling in case CSS fails to load */
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #app { display: flex; height: 100vh; }
    .sidebar { width: 260px; background: #141414; border-right: 1px solid #2a2a2a; padding: 20px; }
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .chat-area { flex: 1; display: flex; flex-direction: column; padding: 20px; }
    .input-area { padding: 20px; border-top: 1px solid #2a2a2a; }
    #chat-input { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; }
    .send-btn { background: #f5c518; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

<div id="app" class="app-layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a href="index.html" class="sidebar-brand">
        <div class="brand-mark">S</div>
        <span class="brand-name">Scholaxia</span>
      </a>
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Session
      </button>
    </div>

    <!-- History -->
    <div class="sidebar-section-label">RECENT SESSIONS</div>
    <div class="sidebar-history" id="chat-history"></div>

    <!-- User -->
    <div class="sidebar-bottom">
      <a href="home.html" class="sidebar-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        For You
      </a>
      <a href="classroom.html" class="sidebar-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Voice Classroom
      </a>
      <a href="cbt.html" class="sidebar-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
        CBT Practice
      </a>
      <div class="user-row">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-meta">
          <span class="user-name" id="user-name-display">Student</span>
          <span class="user-plan">Free Plan</span>
        </div>
        <button class="logout-btn" onclick="logout()" title="Log out">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main-content">

    <!-- Mobile header -->
    <header class="mobile-header">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="mobile-brand">Sia</span>
      <button class="new-chat-mobile" onclick="newChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </header>

    <!-- Chat area -->
    <main class="chat-area">

      <!-- Empty / Welcome state -->
      <div id="empty-state" class="empty-state">
        <div class="welcome-wrap">
          <div class="sia-orb">
            <div class="orb-ring"></div>
            <div class="orb-core">S</div>
          </div>
          <h1 class="welcome-title">Hi <span id="welcome-name">there</span>, I'm <span class="accent">Sia</span></h1>
          <p class="welcome-sub">Your AI learning engine. Ask me anything — I'll teach you deeply, then test your understanding.</p>

          <div class="suggestion-grid">
            <button class="chip" onclick="sendSuggestion('Explain Newton\'s Third Law of Motion', 'Physics')">
              <span class="chip-icon">⚡</span>
              <span>Newton's Third Law</span>
            </button>
            <button class="chip" onclick="sendSuggestion('Solve: x² + 5x + 6 = 0', 'Mathematics')">
              <span class="chip-icon">🔢</span>
              <span>Quadratic equation</span>
            </button>
            <button class="chip" onclick="sendSuggestion('What is photosynthesis?', 'Biology')">
              <span class="chip-icon">🌿</span>
              <span>Photosynthesis</span>
            </button>
            <button class="chip" onclick="sendSuggestion('Explain the causes of World War 1', 'History')">
              <span class="chip-icon">📚</span>
              <span>World War 1 causes</span>
            </button>
            <button class="chip" onclick="sendSuggestion('What is a noun?', 'English')">
              <span class="chip-icon">✍️</span>
              <span>What is a noun?</span>
            </button>
            <button class="chip" onclick="sendSuggestion('Explain osmosis', 'Biology')">
              <span class="chip-icon">🔬</span>
              <span>Osmosis explained</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div id="messages" class="messages"></div>

      <!-- Input -->
      <div class="input-area">
        <div id="image-preview" class="image-preview" style="display:none">
          <img id="preview-img" src="" alt="Selected" />
          <button onclick="clearImage()" class="remove-img">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="input-box">
          <textarea id="chat-input" placeholder="Ask Sia anything..." rows="1"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <div class="input-actions">
            <button onclick="document.getElementById('image-input').click()" class="icon-btn" title="Attach image">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)" />
            <button id="send-btn" onclick="sendMessage()" class="send-btn" title="Send">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">Sia teaches academic subjects only · Powered by Scholaxia AI</p>
      </div>
    </main>
  </div>
</div>

<!-- Sidebar overlay for mobile -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<script src="chat.js"></script>
<script>
  if (!localStorage.getItem("sia_token")) window.location.href = "auth.html";
  const _n = localStorage.getItem("sia_name") || "";
  const _fn = _n.includes("@") ? _n.split("@")[0] : _n.split(" ")[0];
  if (_fn) document.getElementById("welcome-name").textContent = _fn;
</script>
</body>
</html>
